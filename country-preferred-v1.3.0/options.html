<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">Country Preferred</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <img src="icons/icon32.png" alt="" class="topbar-icon">
      <span class="topbar-name">Country Preferred</span>
      <span class="topbar-ver" id="version"></span>
    </div>
    <label class="toggle" data-i18n-attr="title:toggleTitle">
      <input type="checkbox" id="enabled">
      <span class="toggle-track"><span class="toggle-knob"></span></span>
      <span class="toggle-label" id="toggle-label" data-i18n="active"></span>
    </label>
  </header>

  <main class="main">

    <section class="card">
      <div class="card-head">
        <div>
          <h2 data-i18n="preferredTitle"></h2>
          <p class="card-desc" data-i18n="preferredDesc"></p>
        </div>
        <span class="count-pill" id="count-badge">0 / 5</span>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          type="text" id="country-search" class="search-input"
          data-i18n-attr="placeholder:searchPlaceholder;aria-label:searchLabel"
          autocomplete="off" spellcheck="false">
        <ul id="autocomplete-list" class="ac-list hidden" role="listbox" data-i18n-attr="aria-label:suggestionsLabel"></ul>
      </div>

      <ul id="preferred-list" class="pref-list" data-i18n-attr="aria-label:preferredTitle">
        <li class="empty-hint" id="empty-state" data-i18n="emptyPreferred"></li>
      </ul>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 data-i18n="blacklistTitle"></h2>
          <p class="card-desc" data-i18n-html="blacklistDesc"></p>
        </div>
        <button class="icon-btn" id="add-blacklist" data-i18n-attr="aria-label:addDomain">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <ul id="blacklist-list" class="bl-list">
        <li class="empty-hint" id="blacklist-empty" data-i18n="blacklistEmpty"></li>
      </ul>
      <div class="bl-add-row hidden" id="blacklist-input-row">
        <input type="text" id="blacklist-input" class="text-input" placeholder="example.com" spellcheck="false" data-i18n-attr="aria-label:enterDomain">
        <button class="btn btn-primary btn-sm" id="blacklist-confirm" data-i18n="add"></button>
        <button class="btn btn-ghost btn-sm" id="blacklist-cancel" data-i18n="cancel"></button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 data-i18n="backupTitle"></h2>
          <p class="card-desc" data-i18n="backupDesc"></p>
        </div>
      </div>
      <div class="row-gap">
        <button class="btn btn-secondary" id="btn-export">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8M4 7l4 4 4-4M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="export"></span>
        </button>
        <label class="btn btn-secondary" for="btn-import-file">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10V2M4 5l4-4 4 4M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="import"></span>
        </label>
        <input type="file" id="btn-import-file" accept=".json" class="sr-only">
      </div>
    </section>

    <section class="card info-card">
      <details>
        <summary class="info-summary">
          <span data-i18n="aboutTitle"></span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </summary>
        <div class="info-body">
          <p data-i18n="aboutIntro"></p>

          <h3 data-i18n="featuresTitle"></h3>
          <ul>
            <li data-i18n-html="feat1"></li>
            <li data-i18n-html="feat2"></li>
            <li data-i18n-html="feat3"></li>
            <li data-i18n-html="feat4"></li>
            <li data-i18n-html="feat5"></li>
            <li data-i18n-html="feat6"></li>
            <li data-i18n-html="feat7"></li>
            <li data-i18n-html="feat8"></li>
          </ul>

          <h3 data-i18n="compatTitle"></h3>
          <table class="info-table">
            <tbody>
              <tr><td>Chrome, Edge, Brave, Opera, Vivaldi</td><td data-i18n="compatSupported"></td></tr>
              <tr><td>Firefox</td><td data-i18n="compatFirefox"></td></tr>
              <tr><td>Safari (macOS / iOS)</td><td data-i18n="compatSafari"></td></tr>
            </tbody>
          </table>

          <h3 data-i18n="changelogTitle"></h3>
          <ul class="changelog">
            <li><strong>1.3.0</strong> — <span data-i18n="cl130"></span></li>
            <li><strong>1.2.0</strong> — <span data-i18n="cl120"></span></li>
            <li><strong>1.1.1</strong> — <span data-i18n="cl111"></span></li>
            <li><strong>1.1.0</strong> — <span data-i18n="cl110"></span></li>
            <li><strong>1.0.0</strong> — <span data-i18n="cl100"></span></li>
          </ul>
        </div>
      </details>
    </section>

    <section class="card info-card">
      <details>
        <summary class="info-summary">
          <span data-i18n="privacyTitle"></span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </summary>
        <div class="info-body">
          <p class="info-date" data-i18n="privacyDate"></p>

          <h3 data-i18n="privSummaryTitle"></h3>
          <p data-i18n="privSummary"></p>

          <h3 data-i18n="privStoredTitle"></h3>
          <p data-i18n-html="privStoredIntro"></p>
          <ul>
            <li data-i18n="privStored1"></li>
            <li data-i18n="privStored2"></li>
            <li data-i18n="privStored3"></li>
          </ul>
          <p data-i18n="privSync"></p>

          <h3 data-i18n="privNotTitle"></h3>
          <ul>
            <li data-i18n="privNot1"></li>
            <li data-i18n="privNot2"></li>
            <li data-i18n="privNot3"></li>
            <li data-i18n="privNot4"></li>
            <li data-i18n="privNot5"></li>
          </ul>

          <h3 data-i18n="privPermsTitle"></h3>
          <table class="info-table">
            <tbody>
              <tr><td><code>storage</code></td><td data-i18n="privPermStorage"></td></tr>
              <tr><td><code>&lt;all_urls&gt;</code></td><td data-i18n="privPermUrls"></td></tr>
            </tbody>
          </table>
          <p data-i18n="privPermNote"></p>

          <h3 data-i18n="privOssTitle"></h3>
          <p data-i18n="privOss"></p>
        </div>
      </details>
    </section>

  </main>

  <footer class="footer">
    <button class="btn btn-primary btn-lg" id="btn-save" data-i18n="save"></button>
    <span class="save-ok hidden" id="saved-msg" role="status" aria-live="polite" data-i18n="saved"></span>
  </footer>

  <script src="i18n.js"></script>
  <script src="data/countries.js"></script>
  <script src="options.js"></script>
</body>
</html>
